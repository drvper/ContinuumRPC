; Continuum Rich Presence (cRPC) settings
; Delete this file to restore the defaults.

[General]
; Executable that cRPC starts (the original Continuum.exe, renamed)
GameExecutable=Continuum_main.exe
; 0 = do not start the game, just attach to a running Continuum client
LaunchGame=1
; How often the game state is sampled, in milliseconds
PollIntervalMs=1000
; Seconds to wait for the game to appear before exiting
StartupTimeoutSec=60
; 1 = write diagnostics (including memory reads) to cRPC.log
Debug=0

[Memory]
; Read ship, frequency, bounty, etc. directly from the game's memory.
; 0 = fall back to the registry (last used ship only).
Enabled=1
; Offsets for Continuum 0.40 can be overridden here in hex (e.g. Ship=0x5C).
; Defaults come from the Marvin bot (github.com/plushmonkey/Marvin).
; Setting an optional offset (Bounty1, Flags1, Status, MapName, ServerFolder) to 0 disables it.

[Presence]
; 0 = show "In a zone" instead of the zone name
ShowZone=1
; 1 = show your player name (off by default for privacy)
ShowPlayerName=0
ShowMap=1
ShowFrequency=1
ShowBounty=1
ShowFlags=1
ShowSafeZone=1
ShowArenaPopulation=1
; Show "(teammates of players)" next to your status
ShowPartySize=1
; 1 = restart the elapsed timer whenever you switch ships
ResetTimerOnShipChange=0
; 1 = show an elapsed timer while in the zone list
ShowLauncherTimer=0
